[project]
name = "winutils-python"
version = "0.1.0"
description = "Small Python helpers for configuration-driven Windows utilities."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["winutils_python"]

[tool.setuptools.package-dir]
winutils_python = "."
